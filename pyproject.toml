[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ada"
version = "0.1.0"
description = "ADA: Sistema local multiagente de analisis estadistico, limpieza trazable de datos, calculo verificado y simulacion de EDOs sobre DeepSeek Harness y PyTorch."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    # --- Nucleo Matematico, Estadistico y Calculo Verificado ---
    "numpy>=2.1.0",
    "scipy>=1.14.0",
    "sympy>=1.13.3",
    "mpmath>=1.3.0",
    "statsmodels>=0.14.4",
    "scikit-learn>=1.6.0",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.2",
    # --- Ingesta Universal, Limpieza y Consultas Out-of-Core ---
    "pandas>=2.2.3",
    "polars>=1.20.0",
    "duckdb>=1.2.0",
    "pyarrow>=19.0.0",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.1",
    "odfpy>=1.4.1",
    "pyreadstat>=1.2.8",
    "h5py>=3.12.1",
    "lxml>=5.3.0",
    "beautifulsoup4>=4.12.3",
    "html5lib>=1.1",
    "pypdf>=5.1.0",
    "pyyaml>=6.0.2",
    "charset-normalizer>=3.4.0",
    "rapidfuzz>=3.11.0",
    # --- PyTorch GPU (RTX 5070 Blackwell sm_120 via CUDA 12.8) & Fine-Tuning Abierto (QLoRA) ---
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "torchaudio>=2.7.0",
    "transformers>=4.50.0",
    "peft>=0.15.0",
    "accelerate>=1.4.0",
    "datasets>=3.3.0",
    "safetensors>=0.5.0",
    "bitsandbytes>=0.45.0",
    "trl>=0.15.0",
    "huggingface-hub>=0.29.0",
    "gguf>=0.10.0",  # lee y desquantiza los pesos reales del GGUF para el mapa del Observatorio
    # --- Runtime de Agentes (DeepSeek Harness), Servidor MCP y API Web ---
    "deepseek-harness-sdk>=0.2.1rc2",
    "mcp>=1.3.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "rich>=13.9.0",
    "pyserial>=3.5",
    "websockets>=17.4",
    "paho-mqtt>=2.1.0",
    "plotly>=7.1.0",
    "rapidocr-onnxruntime>=1.4.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ada"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]
